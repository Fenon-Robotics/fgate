<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Fenon Gate architecture</title>
  <desc id="desc">Operator configuration and inputs flow into the local Docker Compose GPU backend, asynchronous API, media and inference engines, policy checks, and verified output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111827"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .section { font: 700 25px Arial, sans-serif; fill: #111827; }
      .label { font: 600 22px Arial, sans-serif; fill: #111827; }
      .small { font: 500 18px Arial, sans-serif; fill: #374151; }
      .tag { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .box { stroke: #111827; stroke-width: 4; }
      .line { fill: none; stroke: #111827; stroke-width: 4; marker-end: url(#arrow); }
      .thin-line { fill: none; stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <rect x="8" y="8" width="1584" height="212" rx="4" fill="#ffffff" class="box"/>
  <text x="800" y="46" text-anchor="middle" class="title">Operator surface</text>

  <rect x="42" y="70" width="300" height="112" rx="16" fill="#10dc7b"/>
  <text x="192" y="112" text-anchor="middle" class="label">config.yaml</text>
  <text x="192" y="145" text-anchor="middle" class="small">backend · policy</text>

  <rect x="380" y="70" width="350" height="112" rx="16" fill="#10dc7b"/>
  <text x="555" y="112" text-anchor="middle" class="label">fgate CLI</text>
  <text x="555" y="145" text-anchor="middle" class="small">deploy · check · status · batch</text>

  <rect x="768" y="70" width="350" height="112" rx="16" fill="#10dc7b"/>
  <text x="943" y="112" text-anchor="middle" class="label">HTTPS video</text>
  <text x="943" y="145" text-anchor="middle" class="small">signed source URL</text>

  <rect x="1156" y="70" width="398" height="112" rx="16" fill="#10dc7b"/>
  <text x="1355" y="112" text-anchor="middle" class="label">R2 batch manifest</text>
  <text x="1355" y="145" text-anchor="middle" class="small">frozen size · ETag · destination</text>

  <path d="M8 246 H1592" stroke="#ff3f35" stroke-width="5" stroke-dasharray="22 14"/>
  <rect x="54" y="228" width="286" height="42" fill="#ff4148"/>
  <text x="197" y="256" text-anchor="middle" class="tag">Operator responsibility</text>

  <rect x="8" y="284" width="1584" height="688" rx="4" fill="#ffffff" class="box"/>
  <text x="800" y="326" text-anchor="middle" class="title">Fenon Gate runtime</text>
  <rect x="1216" y="302" width="322" height="43" fill="#ff4148"/>
  <text x="1377" y="331" text-anchor="middle" class="tag">Infrastructure responsibility</text>

  <rect x="44" y="364" width="330" height="294" fill="#ffffff" class="box"/>
  <text x="209" y="402" text-anchor="middle" class="section">Deployment backend</text>

  <rect x="78" y="428" width="262" height="82" rx="13" fill="#4694e8"/>
  <text x="209" y="478" text-anchor="middle" class="label">Docker Compose</text>

  <rect x="78" y="528" width="262" height="82" rx="13" fill="#b9b8fa"/>
  <text x="209" y="561" text-anchor="middle" class="label">Readiness gate</text>
  <text x="209" y="589" text-anchor="middle" class="small">GPU · model · decoder</text>

  <rect x="44" y="690" width="330" height="202" fill="#f9fafb" stroke="#6b7280" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="209" y="730" text-anchor="middle" class="section">Cloud backend</text>
  <rect x="78" y="756" width="262" height="82" rx="13" fill="#e5e7eb"/>
  <text x="209" y="789" text-anchor="middle" class="label">Managed API</text>
  <text x="209" y="817" text-anchor="middle" class="small">upcoming · not released</text>

  <rect x="420" y="364" width="386" height="294" fill="#ffffff" class="box"/>
  <text x="613" y="402" text-anchor="middle" class="section">API &amp; jobs</text>

  <rect x="458" y="428" width="310" height="65" rx="13" fill="#fffbae"/>
  <text x="613" y="469" text-anchor="middle" class="label">FastAPI service</text>

  <rect x="458" y="511" width="310" height="65" rx="13" fill="#fffbae"/>
  <text x="613" y="552" text-anchor="middle" class="label">Async job queue</text>

  <rect x="458" y="594" width="310" height="42" rx="10" fill="#fffbae"/>
  <text x="613" y="622" text-anchor="middle" class="small">Safe R2 batch runner</text>

  <rect x="852" y="364" width="696" height="294" fill="#ffffff" class="box"/>
  <text x="1200" y="402" text-anchor="middle" class="section">Media &amp; inference engine</text>

  <rect x="890" y="438" width="190" height="134" rx="13" fill="#ffb9bd"/>
  <text x="985" y="490" text-anchor="middle" class="label">HTTPS fetch</text>
  <text x="985" y="523" text-anchor="middle" class="small">size · SHA-256</text>

  <rect x="1120" y="438" width="170" height="134" rx="13" fill="#4694e8"/>
  <text x="1205" y="490" text-anchor="middle" class="label">NVDEC</text>
  <text x="1205" y="523" text-anchor="middle" class="small">H.264 frames</text>

  <rect x="1330" y="438" width="180" height="134" rx="13" fill="#4694e8"/>
  <text x="1420" y="483" text-anchor="middle" class="label">TensorRT</text>
  <text x="1420" y="513" text-anchor="middle" class="label">Native</text>
  <text x="1420" y="543" text-anchor="middle" class="small">hand boxes</text>

  <path d="M1080 505 H1120" class="thin-line"/>
  <path d="M1290 505 H1330" class="thin-line"/>

  <rect x="420" y="690" width="696" height="230" fill="#ffffff" class="box"/>
  <text x="768" y="730" text-anchor="middle" class="section">Typed policy engine</text>

  <rect x="450" y="758" width="192" height="60" rx="12" fill="#78e8ec"/>
  <text x="546" y="796" text-anchor="middle" class="label">Covered</text>

  <rect x="657" y="758" width="192" height="60" rx="12" fill="#78e8ec"/>
  <text x="753" y="796" text-anchor="middle" class="label">Hands</text>

  <rect x="864" y="758" width="222" height="60" rx="12" fill="#78e8ec"/>
  <text x="975" y="796" text-anchor="middle" class="label">Idle</text>

  <rect x="450" y="838" width="296" height="58" rx="12" fill="#78e8ec"/>
  <text x="598" y="875" text-anchor="middle" class="label">Steadiness</text>

  <rect x="763" y="838" width="323" height="58" rx="12" fill="#78e8ec"/>
  <text x="925" y="875" text-anchor="middle" class="label">Repetition · warnings</text>

  <rect x="1162" y="690" width="386" height="230" fill="#ffffff" class="box"/>
  <text x="1355" y="730" text-anchor="middle" class="section">Verified output</text>

  <rect x="1200" y="758" width="310" height="60" rx="12" fill="#b9b8fa"/>
  <text x="1355" y="796" text-anchor="middle" class="label">Typed JSON report</text>

  <rect x="1200" y="838" width="310" height="58" rx="12" fill="#b9b8fa"/>
  <text x="1355" y="875" text-anchor="middle" class="label">Evidence · hashes · R2</text>

  <path d="M342 126 H380" class="line"/>
  <path d="M192 182 V270 H24 V469 H78" class="line"/>
  <path d="M555 182 V340 H396 V460 H458" class="line"/>
  <path d="M943 182 V340 H830 V505 H890" class="line"/>
  <path d="M1355 182 V270 H820 V615 H768" class="line"/>
  <path d="M340 469 H420" class="line"/>
  <path d="M340 569 H390 V543 H458" class="line"/>
  <path d="M768 460 H890" class="line"/>
  <path d="M1420 572 V642 H768 V690" class="line"/>
  <path d="M1116 805 H1162" class="line"/>
</svg>
