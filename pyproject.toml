[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fenon-gate"
version = "0.1.0"
description = "API-first quality gate for POV video"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu>=1.20,<1.23; platform_system == 'Linux'",
  "tensorrt-cu12>=10,<11; platform_system == 'Linux'",
  "cuda-python>=12,<13; platform_system == 'Linux'",
  "onnx>=1.17,<2",
]
cpu = ["onnxruntime>=1.20,<2"]
model = ["onnx>=1.17,<2"]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.8,<1", "types-PyYAML>=6.0,<7"]

[project.scripts]
fgate = "fgate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["fgate", "qc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Typer declares CLI metadata through function defaults.

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fgate"]
